name: CI frontend cine

on:
  push:
    branches: [main]

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/front-cine:${{ github.sha }}

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar-dependencias
        run: npm ci --legacy-peer-deps

      - name: compilar
        run: npm run build

  docker:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: inicio-sesion-docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker-build
        run: docker build --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} -t $IMAGEN .

      - name: push-a-docker
        run: |
          docker push $IMAGEN
          echo "imagen subida: $IMAGEN"